# ============================================================================
# Zaslon Browser Android — Sıfır-Telemetri & Zırhlı GeckoView Yapılandırması
# ============================================================================
prefs:
  # 1. Mozilla Telemetri, Glean, Ping-Centre ve Çalışmaları %100 Devre Dışı Bırak
  datareporting.healthreport.uploadEnabled: false
  datareporting.policy.dataSubmissionEnabled: false
  datareporting.policy.dataSubmissionPolicyBypassNotification: true
  toolkit.telemetry.enabled: false
  toolkit.telemetry.unified: false
  toolkit.telemetry.archive.enabled: false
  toolkit.telemetry.server: "http://127.0.0.1"
  toolkit.telemetry.newProfilePing.enabled: false
  toolkit.telemetry.FirstShutdownPing.enabled: false
  toolkit.telemetry.shutdownPingSender.enabled: false
  toolkit.telemetry.updatePing.enabled: false
  toolkit.telemetry.bhrPing.enabled: false
  toolkit.telemetry.firstShutdownPing.enabled: false
  browser.ping-centre.telemetry: false
  app.normandy.enabled: false
  app.normandy.api_url: ""
  app.shield.optoutstudies.enabled: false
  breakpad.reportURL: ""
  browser.tabs.crashReporting.sendReport: false

  # 2. Google SafeBrowsing & Arka Plan Bağlantı Kontrollerini Kapat (Sıfır Paket Çıkışı)
  browser.safebrowsing.malware.enabled: false
  browser.safebrowsing.phishing.enabled: false
  browser.safebrowsing.downloads.enabled: false
  browser.safebrowsing.downloads.remote.enabled: false
  browser.safebrowsing.downloads.remote.url: ""
  network.captive-portal-service.enabled: false
  network.connectivity-service.enabled: false
  network.dns.disablePrefetch: true
  network.dns.disablePrefetchFromHTTPS: true
  network.predictor.enabled: false
  network.prefetch-next: false
  network.http.speculative-parallel-limit: 0

  # 3. WebRTC Gerçek / Yerel IP Sızıntı Kilidi (Tam Devre Dışı + ICE Kilidi)
  media.peerconnection.enabled: false
  media.peerconnection.ice.default_address_only: true
  media.peerconnection.ice.no_host: true
  media.peerconnection.ice.proxy_only_if_behind_proxy: true

  # 4. Parmak İzi Kalkanı (Anti-Fingerprinting, Letterboxing, Spoof-English) & Toplam Çerez İzolasyonu (dFPI)
  privacy.resistFingerprinting: true
  privacy.resistFingerprinting.letterboxing: true
  privacy.resistFingerprinting.autoDeclineNoUserInputCanvasPrompts: true
  privacy.spoof_english: 2
  privacy.window.name.update.enabled: true
  privacy.partition.network_state: true
  privacy.partition.always_partition_third_party_non_cookie_storage: true
  privacy.trackingprotection.enabled: true
  privacy.trackingprotection.socialtracking.enabled: true
  privacy.trackingprotection.cryptomining.enabled: true
  privacy.trackingprotection.fingerprinting.enabled: true
  privacy.donottrackheader.enabled: false
  privacy.globalprivacycontrol.enabled: true
  privacy.globalprivacycontrol.functionality.enabled: true
  network.cookie.cookieBehavior: 5
  network.http.referer.XOriginPolicy: 1
  network.http.referer.XOriginTrimmingPolicy: 2
  beacon.enabled: false
  dom.battery.enabled: false
  dom.gamepad.enabled: false
  dom.netinfo.enabled: false
  device.sensors.enabled: false
  media.webspeech.synth.enabled: false
  geo.enabled: false

  # 5. Şifreli DNS-over-HTTPS (Katı Strict DoH Mod 3 — ISP DNS Fallback Kapalı) & SOCKS Uzak DNS
  network.proxy.socks_remote_dns: true
  network.trr.mode: 3
  network.trr.uri: "https://dns.quad9.net/dns-query"
  network.trr.bootstrapAddress: "9.9.9.9"
  network.trr.excluded-domains: "onion"
  network.dns.blockDotOnion: false
  dom.security.https_only_mode: true
  dom.security.https_only_mode_pbm: true

  # 6. Ekran Kapalıyken YouTube / Video Arka Plan Ses Oynatma Desteği
  media.suspend-bkgnd-video.enabled: false
  media.autoplay.default: 0
  full-screen-api.unprefix.enabled: true
