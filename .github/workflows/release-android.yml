name: Release Android (APK)

on:
  push:
    tags:
      - 'v*'
      - 'android-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Android release tag (ornek: android-v2.0.1)'
        required: true
        default: 'android-v2.0.1'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Decode Release Keystore (if configured)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ZASLON_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release-keystore.jks
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Signed Release APKs
        if: steps.keystore.outputs.has_keystore == 'true'
        env:
          ZASLON_KEYSTORE_PATH: release-keystore.jks
          ZASLON_KEYSTORE_PASSWORD: ${{ secrets.ZASLON_KEYSTORE_PASSWORD }}
          ZASLON_KEY_ALIAS: ${{ secrets.ZASLON_KEY_ALIAS }}
          ZASLON_KEY_PASSWORD: ${{ secrets.ZASLON_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Build Debug APKs (Fallback when no signing secret)
        if: steps.keystore.outputs.has_keystore != 'true'
        run: gradle assembleDebug --no-daemon

      - name: Collect APKs & Generate SHA256SUMS
        run: |
          mkdir -p release-apks
          find app/build/outputs/apk -name "*.apk" -exec cp {} release-apks/ \;
          (cd release-apks && sha256sum *.apk > SHA256SUMS-android.txt)
          ls -lh release-apks

      - name: Upload APKs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            release-apks/*.apk
            release-apks/SHA256SUMS-android.txt
